<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff1f6">
<title>우사기 서바이버</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"></div>
<div id="hurtFx"></div>
<div id="toast"></div>

<!-- 게임 중 UI -->
<div id="hud" class="ingame">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="row">
    <div id="hpwrap"><div id="hpfill"></div></div>
    <span class="panel stat" id="lv">Lv 1</span>
    <span class="panel stat" id="time">00:00</span>
    <span class="panel stat" id="kills">처치 0</span>
    <span class="panel stat" id="coin">보수 0</span>
    <span class="panel stat" id="trait"></span>
    <button id="speedBtn" title="배속 (T)">1x</button>
    <button id="pauseBtn" title="일시정지 (Esc)">❚❚</button>
  </div>
</div>
<!-- 보스 체력 (보스가 있을 때만) -->
<div id="bossBar"><b id="bossName"></b><div id="bossTrack"><div id="bossFill"></div></div></div>
<!-- 현재 능력치 (우측 상단, 눌러서 접기/펴기 · 설정에서 끄기) -->
<div id="statPanel" class="ingame" title="능력치 열기/접기"><div id="statHead">📊 능력치 <span id="statFold">▾</span></div><div id="statBody"></div></div>
<span class="panel stat" id="perf"></span>
<div id="stick" class="ingame"><div id="knob"></div></div>
<button id="runBtn" class="ingame">달리기</button>
<button id="spinBtn" class="ingame">필살!</button>
<div id="help">이동 WASD/방향키 · 공격 자동 · Space 필살기 · T 배속 · Esc 일시정지</div>

<!-- 메인 메뉴 -->
<div class="overlay" id="menu"><div class="card menu-card">
  <h1 id="title">우사기 서바이버</h1>
  <p id="subtitle"><b id="goalTxt">10분</b> 버티고 보스를 물리치세요!</p>
  <div class="btns" style="max-width:320px;margin:0 auto">
    <button class="btn primary" data-act="toSelect">시작하기</button>
    <button class="btn" data-act="training">🏋️ 훈련소</button>
    <button class="btn" data-act="settings">설정</button>
  </div>
  <div class="howto">이동: WASD·방향키<br>공격: 자동<br>필살기: Space (게이지가 차면)</div>
</div></div>

<!-- 캐릭터 선택 -->
<div class="overlay" id="select"><div class="card wide">
  <h2>캐릭터 선택</h2>
  <div id="charCards"></div>
  <div class="row2" style="margin-top:14px">
    <button class="btn" data-act="toMenu">뒤로</button>
    <button class="btn primary" data-act="start">출발! (Enter)</button>
  </div>
</div></div>

<!-- 일시정지 -->
<div class="overlay" id="pause"><div class="card">
  <h2>일시정지</h2>
  <div class="btns">
    <button class="btn primary" data-act="resume">계속하기 (Esc)</button>
    <button class="btn" data-act="restart">다시 시작</button>
    <button class="btn" data-act="settings">설정</button>
    <button class="btn" data-act="toMenu">메인 메뉴</button>
  </div>
  <div id="build"></div>
</div></div>

<!-- 설정 -->
<div class="overlay" id="settings"><div class="card">
  <h2>설정</h2>
  <label class="set"><span>효과음</span><input id="sVol" type="range" min="0" max="1" step="0.05"></label>
  <label class="set"><span>음악 볼륨</span><input id="sMusic" type="range" min="0" max="1" step="0.05"></label>
  <label class="set"><span>자동 조준<small>끄면 이동 방향으로 공격</small></span><input id="sAim" type="checkbox"></label>
  <label class="set"><span>화면 흔들림</span><input id="sShake" type="checkbox"></label>
  <label class="set"><span>능력치 표시<small>현재 능력치 보기</small></span><input id="sStat" type="checkbox"></label>
  <label class="set"><span>피해 숫자<small>공격 피해 표시</small></span><input id="sDmg" type="checkbox"></label>
  <label class="set"><span>적 체력바<small>맞은 적의 체력 표시</small></span><input id="sHpBar" type="checkbox"></label>
  <label class="set dev"><span>판정 표시<small>개발용</small></span><input id="sDbg" type="checkbox"></label>
  <label class="set dev"><span>적 배율 <b id="sStressV"></b><small>개발용 · 부하 테스트</small></span><input id="sStress" type="range" min="1" max="4" step="0.5"></label>
  <div class="btns">
    <button class="btn" data-act="fullscreen">전체 화면</button>
    <button class="btn primary" data-act="back">돌아가기</button>
  </div>
</div></div>

<!-- 레벨업 / 보물상자 -->
<div class="overlay" id="lvup"><div class="card wide">
  <h2 id="lvTitle">레벨 업!</h2>
  <div id="lvOpts"></div>
  <div id="lvTools" class="row2">
    <button class="btn" id="bReroll">다시 뽑기 (R)</button>
    <button class="btn" id="bBanish">빼기 (B)</button>
    <button class="btn" id="bSkip">넘기기 (X)</button>
  </div>
  <div id="lvHint"></div>
</div></div>

<!-- 갑옷씨의 상점 (판 중간) -->
<div class="overlay" id="shop"><div class="card wide">
  <h2>🛡️ 갑옷씨의 상점</h2>
  <div id="shopCoins" class="wallet"></div>
  <div id="shopOpts"></div>
  <div class="row2" style="margin-top:14px"><button class="btn primary" data-act="shopLeave">나가기 <span class="kbd">(X)</span></button></div>
  <div class="hint">보수로 사요 · 한 번 나가면 이 상점은 닫혀요</div>
</div></div>

<!-- 훈련소 (메인 메뉴) -->
<div class="overlay" id="training"><div class="card wide">
  <h2>🏋️ 훈련소</h2>
  <div id="trWallet" class="wallet"></div>
  <div id="trList"></div>
  <div class="hint">판이 끝나면 그 판의 보수가 지갑에 쌓여요 · 모든 캐릭터에 적용</div>
  <div class="btns"><button class="btn primary" data-act="toMenu">돌아가기</button></div>
</div></div>

<!-- 결과 -->
<div class="overlay" id="result"><div class="card">
  <h2 id="resTitle">쓰러졌어요</h2>
  <div id="resTxt"></div>
  <div id="resBest"></div>
  <div id="resBuild"></div>
  <div class="btns">
    <button class="btn primary" data-act="restart">다시 하기 (R)</button>
    <div class="row2">
      <button class="btn" data-act="toSelect">캐릭터 선택</button>
      <button class="btn" data-act="toMenu">메인 메뉴</button>
    </div>
  </div>
</div></div>


<!-- Phaser 3 (전역 Phaser). 오프라인으로 쓰려면 파일을 내려받아 경로만 바꾸면 됨 -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<!-- 게임 코드 (ES 모듈) — 반드시 웹 서버로 열어야 함 (README 참고) -->
<script type="module" src="src/main.js"></script>
</body>
</html>
